[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poes"
version = "0.1.0"
description = "Evaluation-subset scheduling for automatic prompt optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/T-Lab-CUHKSZ/POES"

[project.optional-dependencies]
promptolution = ["promptolution>=2.3,<2.4", "pandas>=2.0"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["poes*"]
